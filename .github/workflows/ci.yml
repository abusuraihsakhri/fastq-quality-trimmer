name: Test, audit and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q fastq_trimmer.py cli.py enrichment.py simulator.py agents tests
      - name: Execute tests
        run: python -m pytest -q

  browser:
    name: Browser engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/test_trimmer.mjs

  deploy:
    name: Deploy static FASTQ app
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [python, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and browser module
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          html="$(mktemp)"
          module="$(mktemp)"
          verified=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 15 "${PAGE_URL}" -o "$html" &&
               curl -fsSL --max-time 15 "${PAGE_URL%/}/trimmer.mjs" -o "$module"; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = "1"
          grep -q 'id="process"' "$html"
          grep -q 'export function trimFastq' "$module"
          echo "Verified live HTML and browser module at ${PAGE_URL}"
